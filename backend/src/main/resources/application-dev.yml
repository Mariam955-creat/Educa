spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:educa}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    properties:
      hibernate.show_sql: true
  flyway:
    # DEV UNIQUEMENT : autorise `flyway:clean` tant que le schéma évolue (Phase 1-3).
    clean-disabled: false
