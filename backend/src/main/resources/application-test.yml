spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_TEST_DB:educa_test}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  flyway:
    clean-disabled: false

educa:
  jwt:
    secret: test-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz
    access-ttl-seconds: 900
    refresh-ttl-seconds: 1209600
  ai:
    enabled: false
