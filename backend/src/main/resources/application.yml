spring:
  application:
    name: educa
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Charge le fichier .env de la racine du dépôt (lancer mvn depuis backend/). Optionnel : en CI/prod on utilise de vraies variables d'env.
  config:
    import: "optional:file:../.env[.properties]"
  # Libellés des PDF (messages*.properties). messages.properties = français : sans repli sur la langue du
  # système, une langue absente retombe toujours sur le français, quelle que soit la machine.
  messages:
    basename: messages
    fallback-to-system-locale: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${STORAGE_MAX_FILE_SIZE_MB:200}MB
      max-request-size: ${STORAGE_MAX_FILE_SIZE_MB:200}MB

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

educa:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  # Origine publique du frontend, utilisée pour construire l'URL du QR code de vérification
  # embarqué dans le PDF du certificat. Même valeur que l'origine CORS (un seul frontend public).
  public-base-url: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    # 32+ octets. En dev une valeur par défaut est fournie ; à surcharger via .env en réel.
    secret: ${JWT_SECRET:dev-only-insecure-change-me-0123456789-abcdefghijklmnop}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:1209600}
  storage:
    local-path: ${STORAGE_LOCAL_PATH:./var/storage}
    max-file-size-mb: ${STORAGE_MAX_FILE_SIZE_MB:200}
  ai:
    enabled: ${AI_ENABLED:false}
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${AI_MODEL:claude-sonnet-5}
    timeout-ms: ${AI_TIMEOUT_MS:15000}
    max-context-chars: ${AI_MAX_CONTEXT_CHARS:4000}
  payment:
    # Origine où l'API est joignable par les prestataires (webhooks serveur-à-serveur).
    # Distincte de public-base-url (origine du frontend) : en dev les deux diffèrent (:8081 vs :4200).
    webhook-base-url: ${WEBHOOK_BASE_URL:http://localhost:8081}
    stripe:
      enabled: ${STRIPE_ENABLED:false}
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      currency: ${STRIPE_CURRENCY:eur}
    orange-money:
      # Intégration directe (pas d'agrégateur) — compte marchand Orange Developer pour un pays donné.
      enabled: ${ORANGE_MONEY_ENABLED:false}
      client-id: ${ORANGE_MONEY_CLIENT_ID:}
      client-secret: ${ORANGE_MONEY_CLIENT_SECRET:}
      merchant-key: ${ORANGE_MONEY_MERCHANT_KEY:}
      country: ${ORANGE_MONEY_COUNTRY:civ}
      currency: ${ORANGE_MONEY_CURRENCY:XOF}

logging:
  level:
    org.springframework.security: INFO
    org.flywaydb: INFO
