# educa — stack de déploiement (backend + frontend + PostgreSQL).
# Voir docs/07-deploiement.md. Compose lit automatiquement le fichier `.env` de ce dossier.
#
#   docker compose up -d --build       démarre tout
#   docker compose logs -f backend     suit les logs
#   docker compose down                arrête (les volumes persistent)
#
# Application accessible sur http://localhost:${WEB_PORT:-8080}

name: educa

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-educa}
      POSTGRES_USER: ${POSTGRES_USER:-educa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis (voir .env)}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-educa} -d ${POSTGRES_DB:-educa}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${BACKEND_PROFILE:-prod}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-educa}
      POSTGRES_USER: ${POSTGRES_USER:-educa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est requis (chaîne aléatoire >= 64 caractères)}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-1209600}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      STORAGE_MAX_FILE_SIZE_MB: ${STORAGE_MAX_FILE_SIZE_MB:-200}
      AI_ENABLED: ${AI_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-15000}
      AI_MAX_CONTEXT_CHARS: ${AI_MAX_CONTEXT_CHARS:-4000}
    volumes:
      - storage-data:/app/var/storage

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db-data:
  storage-data:
