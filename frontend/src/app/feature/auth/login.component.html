<div class="auth-card">
  <h1>{{ 'auth.login.title' | translate }}</h1>
  <p class="subtitle">{{ 'auth.login.subtitle' | translate }}</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      {{ 'auth.login.email' | translate }}
      <input type="email" formControlName="email" autocomplete="email" placeholder="vous@exemple.com" />
    </label>
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <small class="field-error">Email invalide.</small>
    }

    <label>
      {{ 'auth.login.password' | translate }}
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    @if (error()) {
      <p class="form-error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="loading()">
      {{ (loading() ? 'auth.login.submitting' : 'auth.login.submit') | translate }}
    </button>
  </form>

  <p class="switch">
    {{ 'auth.login.noAccount' | translate }} <a routerLink="/register">{{ 'auth.login.create' | translate }}</a>
  </p>
</div>
