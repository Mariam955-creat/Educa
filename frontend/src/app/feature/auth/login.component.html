<div class="auth-card">
  <h1>Connexion</h1>
  <p class="subtitle">educa — plateforme e-learning</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" placeholder="vous@exemple.com" />
    </label>
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <small class="field-error">Email invalide.</small>
    }

    <label>
      Mot de passe
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <small class="field-error">Mot de passe requis.</small>
    }

    @if (error()) {
      <p class="form-error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Connexion…' : 'Se connecter' }}
    </button>
  </form>

  <p class="switch">Pas encore de compte ? <a routerLink="/register">Créer un compte</a></p>
</div>
