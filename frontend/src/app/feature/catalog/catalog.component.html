<header class="catalog-head">
  <div class="catalog-head-inner">
    <h1>{{ 'catalog.title' | translate }}</h1>
    <p class="head-subtitle">{{ 'catalog.subtitle' | translate }}</p>
    <input class="search" type="search" [formControl]="search" [placeholder]="'catalog.searchPlaceholder' | translate" />
  </div>
</header>

<section class="page">
  @if (loading()) {
    <p class="muted">{{ 'common.loading' | translate }}</p>
  } @else if (courses().length === 0) {
    <p class="muted">{{ 'catalog.empty' | translate }}</p>
  } @else {
    <div class="grid">
      @for (course of courses(); track course.id) {
        <app-course-card [course]="course" />
      }
    </div>
  }
</section>
