<section class="chat">
  <h2>{{ 'chat.title' | translate }}</h2>

  <div class="messages">
    @if (turns().length === 0) {
      <p class="hint">{{ 'chat.hint' | translate }}</p>
    }
    @for (turn of turns(); track $index) {
      <div class="msg" [class.user]="turn.role === 'user'">
        <span class="who">{{ (turn.role === 'user' ? 'chat.you' : 'chat.assistant') | translate }}</span>
        <p>{{ turn.content }}</p>
      </div>
    }
    @if (pending()) {
      <div class="msg"><span class="who">{{ 'chat.assistant' | translate }}</span><p class="typing">…</p></div>
    }
  </div>

  <form (submit)="onSubmit($event)">
    <input type="text" [formControl]="input" [placeholder]="'chat.placeholder' | translate" [disabled]="pending()" />
    <button type="submit" [disabled]="!canSend()">{{ 'chat.send' | translate }}</button>
  </form>
</section>
